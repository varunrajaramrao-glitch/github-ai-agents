apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-analyzer
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  rules:
    - host: log-analyzer.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-analyzer
                port:
                  number: 80

