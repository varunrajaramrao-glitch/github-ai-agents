name: CI

on:
  push:
    branches: [main]
    paths:
      - 'log_analyzer_agent/**'
  pull_request:
    branches: [main]
    paths:
      - 'log_analyzer_agent/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t log-analyzer:ci ./log_analyzer_agent