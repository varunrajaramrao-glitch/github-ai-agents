name: Deploy Log Analyzer

on:
  push:
    branches: [main]
    paths:
      - 'log_analyzer_agent/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./log_analyzer_agent
          push: true
          tags: zxcrty/log-analyzer:slim

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Redeploy on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Redeploy log-analyzer" \
            --parameters commands='[
              "docker pull zxcrty/log-analyzer:slim",
              "docker rm -f la || true",
              "GEMINI_KEY=$(aws ssm get-parameter --name /log-analyzer/gemini-api-key --with-decryption --region ap-south-1 --query Parameter.Value --output text)",
              "SERPER_KEY=$(aws ssm get-parameter --name /log-analyzer/serper-api-key --with-decryption --region ap-south-1 --query Parameter.Value --output text)",
              "docker run -d -p 8000:8000 -e GEMINI_API_KEY=$GEMINI_KEY -e SERPER_API_KEY=$SERPER_KEY --name la zxcrty/log-analyzer:slim"
            ]' \
            --query "Command.CommandId" --output text)
          echo "Sent SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"
          echo "Deploy command completed."
